[project]
name = "magicat"
version = "0.1.0"
description = "Short-form video deconstruction framework"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "yt-dlp>=2025.1.26",
    "scenedetect[opencv]>=0.6.4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
transnet = ["transnetv2-pytorch>=1.0"]

[project.scripts]
magicat = "magicat.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["magicat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
