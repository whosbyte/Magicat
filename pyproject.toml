[project]
name = "magicat"
version = "0.1.0"
description = "Short-form video deconstruction framework"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "yt-dlp[default]>=2026.6.9",
    "scenedetect[opencv]>=0.6.4",
    "requests>=2.32",
    "rapidocr>=3.8",
    "onnxruntime>=1.20",
    "pillow>=10",
    "numpy>=1.26",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "pycapcut==0.0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "opentimelineio>=0.18", "otio-fcp-adapter>=1.0", "httpx>=0.27"]
transnet = ["transnetv2-pytorch>=1.0"]
separation = ["demucs-infer>=4.1.3", "soundfile>=0.12"]

[project.scripts]
magicat = "magicat.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["magicat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
